limit_req_zone $binary_remote_addr zone=agenda_mcp:10m rate=20r/s;

server {
    listen 443 ssl http2;
    server_name agenda.trixy.space;

    ssl_certificate /etc/letsencrypt/live/agenda.trixy.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenda.trixy.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    limit_req_status 429;
    error_page 429 = @rate_limited;

    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /mcp {
        limit_req zone=agenda_mcp burst=40 nodelay;
        client_max_body_size 1m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":"rate_limited"}';
    }
}

server {
    listen 80;
    server_name agenda.trixy.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/agenda.trixy.space;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}
